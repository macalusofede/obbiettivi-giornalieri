<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sfide Giornaliere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <div class="stats-bar">
        <div class="stat-item"><span>Totale</span><b id="stat-totale">0</b></div>
        <div class="stat-item"><span>Oggi</span><b id="stat-oggi">0</b></div>
        <div class="stat-item"><span>Streak</span><b id="stat-streak">0 🔥</b></div>
        <button id="btn-apri-cronologia" class="btn-icon">📅</button>
    </div>
    <h1>Sfide Giornaliere</h1>
    <div class="generatore-box">
        <div id="box-sfida">Pronto a vincere?</div>
        <button id="btn-genera">Genera Sfida</button>
        <div id="azioni-sfida" class="hidden">
            <button id="btn-accetta" class="btn-primary">Accetta Sfida ✅</button>
            <button id="btn-cambia" class="btn-secondary" id="btn-cambia">Cambia 🔄</button>
        </div>
    </div>
    <button id="btn-apri-agenda" class="btn-agenda">📝 AGENDA SETTIMANALE</button>
    <div id="sezione-attive">
        <h3>SFIDE IN CORSO</h3>
        <div id="lista-sfide-attive"></div>
    </div>
</div>

<div id="overlay-agenda" class="overlay">
    <div class="overlay-content">
        <div class="header-overlay"><h2>📅 Agenda</h2><button id="btn-chiudi-agenda" class="btn-danger">SALVA</button></div>
        <div class="scroll-agenda">
            <div class="giorno-box"><span>Lunedì</span><textarea id="note-lun"></textarea></div>
            <div class="giorno-box"><span>Martedì</span><textarea id="note-mar"></textarea></div>
            <div class="giorno-box"><span>Mercoledì</span><textarea id="note-mer"></textarea></div>
            <div class="giorno-box"><span>Giovedì</span><textarea id="note-gio"></textarea></div>
            <div class="giorno-box"><span>Venerdì</span><textarea id="note-ven"></textarea></div>
            <div class="giorno-box"><span>Sabato</span><textarea id="note-sab"></textarea></div>
            <div class="giorno-box"><span>Domenica</span><textarea id="note-dom"></textarea></div>
        </div>
    </div>
</div>

<div id="overlay-cronologia" class="overlay">
    <div class="overlay-content">
        <div class="header-overlay"><h2>Cronologia</h2><button id="btn-chiudi-cronologia" class="btn-danger">✖</button></div>
        <div id="calendario-dettagliato"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
